<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMS公域造单平台 - 调用历史记录</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --topbar-bg: #1e4b8f;
            --sidebar-bg: #263238;
            --sidebar-text: #b7c0c9;
            --sidebar-active-bg: #1e4b8f;
            --border: #dcdfe6;
            --border-soft: #eef0f3;
            --text: #303133;
            --text-dim: #555861;
            --text-mute: #909399;
            --accent: #1e4b8f;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --green: #16a34a;
            --green-hover: #15803d;
            --red: #dc3545;
            --warning: #d69e2e;
            --info: #3b82f6;
            --th-bg: #eef2f8;
            --mono: 'Cascadia Code', 'Consolas', 'Monaco', 'Courier New', monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { height: 100%; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: var(--bg); color: var(--text); font-size: 14px; overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .topbar {
            height: 48px; display: flex; align-items: center; justify-content: space-between;
            padding: 0 20px; background: var(--topbar-bg); border-bottom: 1px solid #163a6b;
            color: #fff; flex-shrink: 0;
        }
        .topbar .title { font-size: 15px; font-weight: 600; letter-spacing: 0.5px; color: #fff; }
        .topbar .title .accent { color: #a7c8ff; }

        .layout { display: flex; height: calc(100vh - 48px); }

        .sidebar {
            width: 240px; min-width: 240px; background: var(--sidebar-bg);
            overflow-y: auto; padding: 12px 8px; flex-shrink: 0;
        }
        .nav-header { padding: 8px 12px 6px; }
        .nav-header .app-title { font-size: 14px; font-weight: 600; color: #fff; }
        .nav-header .app-subtitle { font-size: 12px; color: var(--sidebar-text); margin-top: 3px; }
        .nav-divider { height: 1px; background: rgba(255,255,255,0.10); margin: 10px 12px 8px; }

        .nav-item {
            display: block; width: 100%; text-align: left; padding: 10px 12px; margin: 2px 0;
            background: transparent; border: none; border-radius: 6px; color: var(--sidebar-text);
            font-size: 13px; cursor: pointer; transition: background 0.15s ease, color 0.15s ease;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .nav-item:hover { background: rgba(255,255,255,0.08); color: #fff; }
        .nav-item.active { background: var(--sidebar-active-bg); color: #fff; font-weight: 600; }
        a.nav-item { text-decoration: none; }

        .main { flex: 1; overflow-y: auto; padding: 16px 20px 32px; }

        .btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 6px;
            height: 32px; padding: 0 14px; border: none; border-radius: 6px;
            font-size: 13px; font-weight: 600; cursor: pointer; transition: background 0.15s ease; white-space: nowrap;
            text-decoration: none;
        }
        .btn-secondary { background: #e9edf2; color: var(--text-dim); }
        .btn-secondary:hover { background: #dfe4ea; }
        .btn-danger { background: var(--red); color: #fff; }
        .btn-danger:hover { background: #c82333; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .table-wrap {
            overflow-x: auto; background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 8px; box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
        .data-table th, .data-table td { border-bottom: 1px solid var(--border-soft); padding: 7px 12px; text-align: left; }
        .data-table th { background: var(--th-bg); font-weight: 600; color: var(--text-dim); white-space: nowrap; }
        .data-table td { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .data-table tbody tr:hover { background: #f6f8fc; }
        .data-table td.mono { font-family: var(--mono); }
        .table-empty { color: var(--text-mute); text-align: center; padding: 32px 0; }

        .badge { display: inline-block; padding: 2px 10px; border-radius: 4px; font-size: 12px; font-weight: 600; }
        .badge-ok { background: #e8f5e9; color: var(--green); }
        .badge-err { background: #fdecea; color: var(--red); }
        .badge-mute { background: #f0f0f0; color: #555861; }

        .pager { display: flex; align-items: center; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
        .pager .info { font-size: 13px; color: var(--text-mute); }

        #toast-container { position: fixed; top: 20px; right: 20px; z-index: 9999; display: flex; flex-direction: column; gap: 10px; }
        .toast {
            padding: 10px 16px; border-radius: 6px; color: #fff; font-size: 13px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15); max-width: 360px; word-break: break-all;
            opacity: 0; transform: translateY(-10px); transition: all 0.3s ease;
        }
        .toast.show { opacity: 1; transform: translateY(0); }
        .toast-success { background: var(--green); }
        .toast-error { background: var(--red); }
        .toast-warning { background: var(--warning); }
        .toast-info { background: var(--info); }

        /* 可折叠父菜单 */
        .nav-group { margin: 2px 0; }
        .nav-parent { display: flex; align-items: center; justify-content: space-between; }
        .nav-arrow { font-size: 12px; transition: transform 0.2s ease; }
        .nav-group.collapsed .nav-arrow { transform: rotate(-90deg); }
        .nav-group.collapsed .nav-sub { display: none; }
        .nav-sub { overflow: hidden; }
        .nav-sub-item { padding-left: 32px; font-size: 12px; }
    </style>
</head>
<body>
    <div class="topbar">
        <span class="title">调用历史记录 <span class="accent">-</span> 公域平台造单</span>
        <a class="btn btn-secondary" href="/">返回OMS公域造单平台</a>
    </div>

    <div class="layout">
        <aside class="sidebar">
            <div class="nav-header">
                <div class="app-title">OMS公域造单平台</div>
                <div class="app-subtitle">中间表 · 订单 · 回传</div>
            </div>
            <div class="nav-divider"></div>
            <div class="nav-group">
                <button class="nav-item nav-parent" type="button">
                    <span>基础配置</span><span class="nav-arrow">▾</span>
                </button>
                <div class="nav-sub">
                    <a class="nav-item nav-sub-item" href="/#env_config">环境配置</a>
                    <a class="nav-item nav-sub-item" href="/#db_config">数据库配置</a>
                </div>
            </div>
            <a class="nav-item" href="/#order_copy">平台订单中间表复制</a>
            <a class="nav-item" href="/#stock_adjust">调整库存</a>
            <a class="nav-item" href="/#platform_order">公域平台正向造单</a>
            <a class="nav-item" href="/#reverse_order">公域平台逆向造单</a>
            <a class="nav-item active" href="/history">历史记录</a>
            <a class="nav-item" href="/message-data">报文主数据</a>
        </aside>

        <main class="main">
            <div class="table-wrap">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>时间</th>
                            <th>方法</th>
                            <th>请求 URL</th>
                            <th>状态码</th>
                            <th>耗时</th>
                            <th>结果</th>
                            <th style="width:80px;">操作</th>
                        </tr>
                    </thead>
                    <tbody id="history-body">
                        <tr><td colspan="8" class="table-empty">加载中…</td></tr>
                    </tbody>
                </table>
            </div>

            <div class="pager">
                <button class="btn btn-secondary" id="btn-prev" onclick="changePage(-1)">上一页</button>
                <button class="btn btn-secondary" id="btn-next" onclick="changePage(1)">下一页</button>
                <span class="info" id="page-info"></span>
            </div>
        </main>
    </div>

    <div id="toast-container"></div>

    <script>
        var PAGE_SIZE = 20;   // 默认每页 20 条
        var page = 1;
        var total = 0;

        function showToast(message, type) {
            const container = document.getElementById('toast-container');
            if (!container) { return; }
            const toast = document.createElement('div');
            toast.className = 'toast toast-' + (type || 'info');
            toast.textContent = message;
            container.appendChild(toast);
            requestAnimationFrame(function () { toast.classList.add('show'); });
            setTimeout(function () {
                toast.classList.remove('show');
                setTimeout(function () { toast.remove(); }, 300);
            }, 3000);
        }

        function escapeHtml(s) {
            return String(s == null ? '' : s)
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        function loadList() {
            const body = document.getElementById('history-body');
            body.innerHTML = '<tr><td colspan="8" class="table-empty">加载中…</td></tr>';
            fetch('/api/history?page=' + page + '&page_size=' + PAGE_SIZE)
                .then(function (resp) { return resp.json(); })
                .then(function (data) {
                    if (data && data.success) {
                        total = data.total || 0;
                        renderRows(data.records || []);
                        renderPager();
                    } else {
                        body.innerHTML = '<tr><td colspan="8" class="table-empty">加载失败</td></tr>';
                        showToast('加载失败：' + ((data && data.error_msg) || '未知错误'), 'error');
                    }
                })
                .catch(function () {
                    body.innerHTML = '<tr><td colspan="8" class="table-empty">加载失败</td></tr>';
                    showToast('加载失败：网络或服务异常', 'error');
                });
        }

        function renderRows(records) {
            const body = document.getElementById('history-body');
            if (!records.length) {
                body.innerHTML = '<tr><td colspan="8" class="table-empty">暂无历史记录</td></tr>';
                return;
            }
            body.innerHTML = '';
            records.forEach(function (r) {
                const tr = document.createElement('tr');

                const tdId = document.createElement('td');
                tdId.textContent = r.id;
                tr.appendChild(tdId);

                const tdTime = document.createElement('td');
                tdTime.textContent = r.create_time || '-';
                tr.appendChild(tdTime);

                const tdMethod = document.createElement('td');
                tdMethod.textContent = r.request_method || '-';
                tr.appendChild(tdMethod);

                const tdUrl = document.createElement('td');
                tdUrl.className = 'mono';
                tdUrl.textContent = r.request_url || '-';
                tdUrl.title = r.request_url || '';
                tr.appendChild(tdUrl);

                const tdCode = document.createElement('td');
                tdCode.textContent = (r.response_code == null || r.response_code === '') ? '-' : r.response_code;
                tr.appendChild(tdCode);

                const tdCost = document.createElement('td');
                tdCost.textContent = (r.cost_ms == null || r.cost_ms === '') ? '-' : (r.cost_ms + ' ms');
                tr.appendChild(tdCost);

                const tdResult = document.createElement('td');
                const resultBadge = document.createElement('span');
                if (r.error_msg) {
                    resultBadge.className = 'badge badge-err';
                    resultBadge.textContent = '失败';
                    tdResult.title = r.error_msg;
                } else {
                    resultBadge.className = 'badge badge-ok';
                    resultBadge.textContent = '成功';
                }
                tdResult.appendChild(resultBadge);
                tr.appendChild(tdResult);

                const tdOp = document.createElement('td');
                const delBtn = document.createElement('button');
                delBtn.type = 'button';
                delBtn.className = 'btn btn-danger';
                delBtn.textContent = '删除';
                delBtn.addEventListener('click', function () { deleteRecord(r.id); });
                tdOp.appendChild(delBtn);
                tr.appendChild(tdOp);

                body.appendChild(tr);
            });
        }

        function renderPager() {
            const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            document.getElementById('page-info').textContent = '第 ' + page + ' / ' + totalPages + ' 页，共 ' + total + ' 条';
            document.getElementById('btn-prev').disabled = page <= 1;
            document.getElementById('btn-next').disabled = page >= totalPages;
        }

        function changePage(delta) {
            const totalPages = Math.max(1, Math.ceil(total / PAGE_SIZE));
            const next = page + delta;
            if (next < 1 || next > totalPages) { return; }
            page = next;
            loadList();
        }

        function deleteRecord(id) {
            if (!confirm('确认删除该条记录（ID=' + id + '）吗？')) { return; }
            fetch('/api/history/' + id, { method: 'DELETE' })
                .then(function (resp) { return resp.json(); })
                .then(function (data) {
                    if (data && data.success) {
                        showToast('删除成功', 'success');
                        loadList(); // 删除后刷新列表
                    } else {
                        showToast('删除失败：' + ((data && data.error_msg) || '未知错误'), 'error');
                    }
                })
                .catch(function () {
                    showToast('删除失败：网络或服务异常', 'error');
                });
        }

        loadList();
    </script>
    <script>
        document.querySelectorAll('.nav-parent').forEach(function (btn) {
            btn.addEventListener('click', function () {
                var group = btn.closest('.nav-group');
                if (group) { group.classList.toggle('collapsed'); }
            });
        });
    </script>
</body>
</html>
